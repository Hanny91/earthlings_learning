name: Deploy to GoDaddy

on:
  push:
    branches: [ master ]  # or master, depending on your default branch
  workflow_dispatch:    # allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: map-app/package-lock.json

    # Builds the survey map into ./map/, which is uploaded with the rest of the site.
    # The VITE_ values are public, so they are repository variables, not secrets.
    - name: Build survey map
      working-directory: map-app
      env:
        VITE_DATA_API_URL: ${{ vars.VITE_DATA_API_URL }}
        VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL }}
        VITE_THUNDERFOREST_KEY: ${{ vars.VITE_THUNDERFOREST_KEY }}
      run: |
        npm ci
        npm run build

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./          # Change to ./dist/ or ./build/ if you have a build step
        server-dir: /public_html/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.env*
          **/README.md
          map-app/**
          db/**
          project.md
          assumptions.md
          .vscode/**